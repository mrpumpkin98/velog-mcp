[project]
name = "velog-mcp"
version = "0.1.0"
description = "벨로그(velog) 글 발행·수정을 MCP 도구로 노출하는 서버 / MCP server for publishing and updating velog posts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "velog", "blog", "markdown", "publishing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Korean",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    # 상한이 중요하다. mcp 2.0 은 번들돼 있던 FastMCP 를 떼어냈고(별도 fastmcp 패키지),
    # mcp.server.fastmcp 임포트가 깨진다. 상한이 없으면 새로 설치하는 사람은
    # 2.0 을 받아 서버가 시작조차 못 한다. 2.0 대응은 별도 작업으로 다룬다.
    "mcp[cli]>=1.28.1,<2",
    "httpx>=0.28.1",
    "python-frontmatter>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/mrpumpkin98/velog-mcp"
Repository = "https://github.com/mrpumpkin98/velog-mcp"
Issues = "https://github.com/mrpumpkin98/velog-mcp/issues"
Documentation = "https://github.com/mrpumpkin98/velog-mcp/blob/main/docs/how-it-works.md"

[project.optional-dependencies]
# 브라우저 로그인(velog_login 도구 / scripts/login.py)에만 필요하다.
# 토큰을 직접 넣어 쓰는 경우에는 설치하지 않아도 된다.
login = ["playwright>=1.48"]

[project.scripts]
velog-mcp = "velog_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/velog_mcp"]

[tool.hatch.build.targets.sdist]
# 스크린샷은 벨로그 글이 GitHub raw URL 로 참조하는 것이라 저장소에는 있어야 하지만,
# 문서에서 쓰이지 않으므로 배포 패키지에 넣을 이유가 없다(약 390KB).
exclude = ["docs/images"]
